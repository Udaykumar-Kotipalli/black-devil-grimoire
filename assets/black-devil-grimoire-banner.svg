<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Black Devil Grimoire</title>
<desc id="desc">Original gothic anime-inspired banner in black, crimson, and parchment white, featuring an abstract five-leaf grimoire seal, chain motifs, and blade-like geometry. No official character artwork.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050506"/><stop offset=".55" stop-color="#12090c"/><stop offset="1" stop-color="#26080d"/></linearGradient>
  <radialGradient id="redglow"><stop stop-color="#e52535" stop-opacity=".35"/><stop offset="1" stop-color="#e52535" stop-opacity="0"/></radialGradient>
  <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f0f0"/><stop offset=".25" stop-color="#4b4144"/><stop offset=".55" stop-color="#111"/><stop offset="1" stop-color="#e52535"/></linearGradient>
  <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 7h8m12 14h8M9 0v4m8 20v4" stroke="#f4f0f0" stroke-opacity=".06"/></pattern>
</defs>
<rect width="1200" height="380" rx="14" fill="url(#bg)"/>
<rect width="1200" height="380" rx="14" fill="url(#grain)"/>
<circle cx="920" cy="180" r="260" fill="url(#redglow)"/>
<g stroke="#e52535" fill="none" opacity=".62">
  <path d="M0 40H360L410 90H660M0 330H330L390 270H690" stroke-width="2"/>
  <path d="M40 0V120l30 30-30 30v90M1160 0v80l-22 22 22 22v120" stroke-width="1.4"/>
  <path d="M710 20L1120 360M760 0L1160 330" stroke-opacity=".2"/>
</g>
<g fill="none" stroke="#a9a0a1" stroke-opacity=".35">
  <circle cx="930" cy="180" r="135"/><circle cx="930" cy="180" r="117" stroke-dasharray="2 8"/>
  <circle cx="930" cy="180" r="88"/><path d="M930 35V325M785 180H1075M827 77l206 206M1033 77L827 283"/>
</g>
<!-- Original abstract five-leaf seal -->
<g transform="translate(930 180)" stroke="#e52535" stroke-width="2" fill="#10090b" fill-opacity=".7">
  <ellipse cx="0" cy="-37" rx="21" ry="37"/>
  <ellipse cx="35" cy="-11" rx="21" ry="37" transform="rotate(72 35 -11)"/>
  <ellipse cx="22" cy="30" rx="21" ry="37" transform="rotate(144 22 30)"/>
  <ellipse cx="-22" cy="30" rx="21" ry="37" transform="rotate(216 -22 30)"/>
  <ellipse cx="-35" cy="-11" rx="21" ry="37" transform="rotate(288 -35 -11)"/>
  <circle r="18"/><path d="M-8 0L0-12 8 0 0 12Z" fill="#e52535"/>
</g>
<!-- Blade-inspired abstract geometry -->
<path d="M1100 38L1142 20 1115 112 1092 165 1101 100Z" fill="url(#blade)" opacity=".9"/>
<path d="M1085 145l-35 36 53-12 20-28-24 10z" fill="#e52535" opacity=".8"/>
<g font-family="Consolas, 'Courier New', monospace">
  <text x="62" y="65" font-size="12" letter-spacing="5" fill="#e52535">GRIMOIRE ARCHIVE / 001</text>
  <text x="58" y="148" font-size="54" font-weight="700" letter-spacing="2" fill="#f4f0f0">BLACK DEVIL</text>
  <text x="58" y="208" font-size="54" font-weight="700" letter-spacing="2" fill="#e52535">GRIMOIRE</text>
  <path d="M62 231H430l12-7 12 7h60" stroke="#e52535" fill="none" stroke-width="2"/>
  <text x="62" y="264" font-size="15" letter-spacing="2" fill="#e8dfe0">DATA ANNOTATION  /  AI EVALUATION</text>
  <text x="62" y="303" font-size="12" letter-spacing="3" fill="#a9a0a1">NO CLAIMS WITHOUT PROOF.</text>
  <text x="930" y="352" font-size="10" text-anchor="middle" letter-spacing="3" fill="#f4f0f0">ANTI-MAGIC / DISCIPLINE / PROGRESS</text>
</g>
</svg>